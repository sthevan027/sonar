[package]
name = "sonar"
version = "0.1.0"
description = "Controle de áudio por app no Windows"
authors = ["Sthevan Santos"]
edition = "2021"

[lib]
# O sufixo `_lib` evita conflito de nome com o binário (ver issue 8519 do cargo, no Windows).
name = "sonar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"

[target.'cfg(windows)'.dependencies]
# Roteamento por app (audio/policy.rs): ativação WinRT, vtable do AudioPolicyConfig e build via RtlGetVersion.
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_SystemInformation",
  "Win32_System_WinRT",
  "Wdk_System_SystemServices",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
