<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"><style>*{margin:0;box-sizing:border-box}
:root{--bg:#0F0E0D;--panel:#1B1A18;--card:#25231F;--line:#37332B;--text:#EDE6D6;--mute:#9A917F;--brass:#D9A441;--sage:#86A9B8;--live:#8FBF7A}
body{width:420px;height:700px;background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text);display:flex;align-items:center;justify-content:center}
.win{width:388px;height:668px;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.55);padding:18px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.ic{display:block;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600}
.mono{font-family:'JetBrains Mono',monospace}
.top{display:flex;align-items:center;gap:10px}
.back{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;background:var(--card)}
.top b{font-family:'Bricolage Grotesque',sans-serif;font-size:18px;font-weight:600;flex:1}
.row{display:flex;align-items:center;gap:11px}
.logo{width:28px;height:28px;border-radius:8px;flex:none}
.chip{display:flex;align-items:center;gap:6px;height:30px;padding:0 8px 0 10px;border-radius:9px;font-size:12px;font-weight:600;border:1px solid;flex:none}
.chip.hs{color:var(--brass);border-color:rgba(217,164,65,.45);background:rgba(217,164,65,.08)}
.chip.sp{color:var(--sage);border-color:rgba(134,169,184,.45);background:rgba(134,169,184,.08)}
.tile.hs{background:rgba(217,164,65,.10);border-color:rgba(217,164,65,.45)}
.field{height:40px;border-radius:11px;background:var(--panel);border:1px solid var(--brass);padding:0 12px;display:flex;align-items:center;font-size:15px}
.field em{font-style:normal;color:var(--mute);font-size:12px;margin-left:auto}
.icons{display:flex;gap:8px}
.g{width:38px;height:38px;border-radius:11px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center}
.g.sel{border-color:var(--brass);background:#2D2819}
.plist{display:flex;flex-direction:column;gap:8px}
.pr{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 10px;display:flex;flex-direction:column;gap:8px}
.pr .row{gap:10px}.pr .nm{flex:1;font-size:14px;font-weight:600}
.big{width:70px;height:70px;border-radius:20px;background:#2D2819;border:1px solid var(--brass);box-shadow:0 0 0 4px rgba(217,164,65,.16);display:grid;place-items:center;flex:none}
.addapp{height:38px;border:1.5px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:var(--mute)}
.btn{height:44px;border-radius:13px;display:grid;place-items:center;font-weight:600;font-size:14px}
.btn.pri{flex:1;background:var(--brass);color:#1B1A18}.btn.sec{width:112px;background:var(--card);border:1px solid var(--line)}
