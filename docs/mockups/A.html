<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"><style>*{margin:0;box-sizing:border-box}
:root{--bg:#0F0E0D;--panel:#1B1A18;--card:#25231F;--line:#37332B;--text:#EDE6D6;--mute:#9A917F;--brass:#D9A441;--sage:#86A9B8;--live:#8FBF7A}
body{width:420px;height:700px;background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text);display:flex;align-items:center;justify-content:center}
.win{width:388px;height:668px;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.55);padding:18px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.ic{display:block;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600}
.mono{font-family:'JetBrains Mono',monospace}
.cnt{font-size:12px;color:var(--mute)}
.prof{display:flex;align-items:center;gap:10px}
.pbtn{width:44px;height:44px;border-radius:13px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}
.pbtn.on{border-color:var(--brass);box-shadow:0 0 0 3px rgba(217,164,65,.18);background:#2D2819}
.pbtn.add{border-style:dashed;background:transparent}
.pname{margin-left:auto;text-align:right}
.pname b{font-family:'Bricolage Grotesque',sans-serif;font-size:17px;font-weight:600;display:block}
.pname span{font-size:12px;color:var(--mute)}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
.tab{flex:1;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:13px;font-weight:600;color:var(--mute)}
.tab.on{background:#2D2819;color:var(--brass)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:11px}
.who{flex:1;min-width:0}
.who b{font-size:14px;font-weight:600;display:block}
.who span.o{font-size:12px;color:var(--mute);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{width:28px;height:28px;border-radius:8px;flex:none}
.chip{display:flex;align-items:center;gap:6px;height:30px;padding:0 8px 0 10px;border-radius:9px;font-size:12px;font-weight:600;border:1px solid;flex:none}
.chip.hs{color:var(--brass);border-color:rgba(217,164,65,.45);background:rgba(217,164,65,.08)}
.chip.sp{color:var(--sage);border-color:rgba(134,169,184,.45);background:rgba(134,169,184,.08)}
.track{height:6px;border-radius:3px;background:var(--line);position:relative;flex:1}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--text);opacity:.85}
.track u{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:var(--text);transform:translate(-50%,-50%);box-shadow:0 1px 4px rgba(0,0,0,.5)}
.track.br i{background:var(--brass);opacity:1}
.pct{width:30px;text-align:right;font-size:12px;color:var(--mute)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--live);box-shadow:0 0 0 3px rgba(143,191,122,.18);display:inline-block;margin-right:4px}
.foot{margin-top:auto;display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mute);border-top:1px solid var(--line);padding-top:11px}
.foot b{color:var(--text);font-weight:500}
.tile.hs{background:rgba(217,164,65,.10);border-color:rgba(217,164,65,.45)}
.icons{display:flex;gap:8px}
.pr .row{gap:10px}.pr .nm{flex:1;font-size:14px;font-weight:600}
